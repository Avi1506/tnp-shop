name: Temporary dependency patch
on:
  push:
    branches:
      - fix/auth-security-hardening-20260928

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auth-security-hardening-20260928
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm install next@16.3.6 --save-exact
      - run: npm audit fix --package-lock-only || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: patch vulnerable runtime dependencies"
          git push origin HEAD:fix/auth-security-hardening-20260928
