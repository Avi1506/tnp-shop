name: Temporary 3D preview verification
on:
  push:
    branches:
      - feat/customization-engine-v2-20260928

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused ESLint
        run: npx eslint src/db/schema.ts src/lib/print-template.ts src/components/product/Cylindrical3DScene.tsx src/components/product/Cylindrical3DPreview.tsx src/components/product/CustomizeCanvas.tsx src/components/admin/PrintTemplateEditor.tsx src/app/admin/\(dashboard\)/categories/page.tsx
      - name: TypeScript
        run: npx next typegen && npx tsc --noEmit
