name: customizer-ci

on:
  push:
    branches:
      - feat/customization-engine-v2-20260928

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Install browser QA
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Capture customizer QA
        env:
          QA_URL: "https://tnp-shop-1jav088gq-tnp-shop-team.vercel.app/products/chinese-cup/customize?_vercel_share=EAmdoH7l7iO644zDlkdllhrHOy11kONC"
        run: |
          mkdir -p qa-output
          cat > customizer-qa.mjs <<'EOF'
          import { chromium } from "playwright";
          import fs from "node:fs";

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1100 } });

          const consoleErrors = [];
          page.on("console", (msg) => {
            if (msg.type() === "error") consoleErrors.push(msg.text());
          });
          page.on("pageerror", (error) => consoleErrors.push(error.message));

          await page.goto(process.env.QA_URL, { waitUntil: "networkidle", timeout: 90000 });

          // Purpose-built full-wrap image: LEFT / FRONT / RIGHT are visually
          // distinct so wrong UV orientation or flat mapping is immediately obvious.
          const dataUrl = await page.evaluate(() => {
            const canvas = document.createElement("canvas");
            canvas.width = 1500;
            canvas.height = 700;
            const ctx = canvas.getContext("2d");
            if (!ctx) throw new Error("No canvas context");

            const grad = ctx.createLinearGradient(0, 0, canvas.width, 0);
            grad.addColorStop(0, "#6aa9d8");
            grad.addColorStop(0.33, "#d8edf8");
            grad.addColorStop(0.5, "#f4d39d");
            grad.addColorStop(0.67, "#f8dfb6");
            grad.addColorStop(1, "#df8f82");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "rgba(20,30,50,.35)";
            ctx.lineWidth = 4;
            for (let x = 0; x <= canvas.width; x += 125) {
              ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += 100) {
              ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            ctx.fillStyle = "#17335d";
            ctx.font = "bold 110px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("LEFT", 260, 350);
            ctx.fillText("FRONT", 750, 350);
            ctx.fillText("RIGHT", 1240, 350);

            ctx.beginPath();
            ctx.arc(750, 350, 185, 0, Math.PI * 2);
            ctx.lineWidth = 22;
            ctx.strokeStyle = "#8b4f20";
            ctx.stroke();

            ctx.fillStyle = "#fff";
            ctx.font = "bold 48px sans-serif";
            ctx.fillText("TOP", 750, 65);
            ctx.fillText("BOTTOM", 750, 635);

            return canvas.toDataURL("image/png");
          });

          const buffer = Buffer.from(dataUrl.split(",")[1], "base64");
          const input = page.locator('input[type="file"]').first();
          await input.setInputFiles({
            name: "qa-full-wrap.png",
            mimeType: "image/png",
            buffer,
          });

          await page.waitForTimeout(7000);

          const bodyText = await page.locator("body").innerText();
          if (/Could not upload image|Large image upload needs|Upload failed/i.test(bodyText)) {
            throw new Error("Upload UI reported failure");
          }

          await page.screenshot({ path: "qa-output/editor-after-upload.png", fullPage: true });

          await page.getByRole("button", { name: /Preview on product/i }).click();
          await page.waitForTimeout(5000);

          await page.screenshot({ path: "qa-output/desktop-front.png", fullPage: true });

          await page.getByRole("button", { name: "Left", exact: true }).first().click();
          await page.waitForTimeout(2000);
          await page.screenshot({ path: "qa-output/desktop-left.png", fullPage: true });

          await page.getByRole("button", { name: "Right", exact: true }).first().click();
          await page.waitForTimeout(2000);
          await page.screenshot({ path: "qa-output/desktop-right.png", fullPage: true });

          await page.setViewportSize({ width: 390, height: 844 });
          await page.getByRole("button", { name: "Front", exact: true }).first().click();
          await page.waitForTimeout(2000);
          await page.screenshot({ path: "qa-output/mobile-front.png", fullPage: true });

          fs.writeFileSync("qa-output/console-errors.txt", consoleErrors.join("\n"));
          await browser.close();
          EOF
          node customizer-qa.mjs
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customizer-qa
          path: qa-output/
          if-no-files-found: warn
