name: Temporary auth security verification
on:
  push:
    branches:
      - fix/auth-security-hardening-20260928

jobs:
  generate-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Patch dependencies in workspace
        run: |
          npm install next@16.3.6 eslint-config-next@16.3.6 --save-exact
          npm audit fix --package-lock-only || true
      - name: Verify critical advisories removed
        run: npm audit --omit=dev --audit-level=critical
      - uses: actions/upload-artifact@v4
        with:
          name: patched-package-files
          path: |
            package.json
            package-lock.json
