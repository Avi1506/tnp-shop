name: temp-rim-qa
on:
  push:
    branches:
      - feat/customization-engine-v2-20260928
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src/components/product/Cylindrical3DScene.tsx
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Capture rim QA
        env:
          QA_URL: "https://tnp-shop-ihi4tv6uh-tnp-shop-team.vercel.app/products/chinese-cup/customize?_vercel_share=2bC57pTZ5lHYvKD5skrBLJ8cbJjcgFkC"
        run: |
          mkdir -p qa-output
          cat > qa.mjs <<'EOF'
          import { chromium } from "playwright";
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1100}});
          await page.goto(process.env.QA_URL,{waitUntil:"networkidle",timeout:90000});
          const dataUrl=await page.evaluate(()=>{
            const canvas=document.createElement("canvas");canvas.width=1500;canvas.height=700;
            const ctx=canvas.getContext("2d");if(!ctx)throw new Error("ctx");
            ctx.fillStyle="#f5e6bc";ctx.fillRect(0,0,1500,700);
            ctx.fillStyle="#18345b";ctx.font="bold 110px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
            ctx.fillText("FRONT",750,350);
            return canvas.toDataURL("image/png");
          });
          await page.locator('input[type="file"]').first().setInputFiles({name:"rim-qa.png",mimeType:"image/png",buffer:Buffer.from(dataUrl.split(",")[1],"base64")});
          await page.waitForTimeout(6000);
          await page.getByRole("button",{name:/Preview on product/i}).click();
          await page.waitForTimeout(5000);
          await page.screenshot({path:"qa-output/front.png",fullPage:true});
          await browser.close();
          EOF
          node qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rim-qa
          path: qa-output/
