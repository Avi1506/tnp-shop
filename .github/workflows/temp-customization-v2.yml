name: Temporary customization v2 verification
on:
  push:
    branches:
      - feat/customization-engine-v2-20260928

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Focused ESLint
        run: npx eslint src/db/schema.ts src/lib/print-template.ts src/lib/client-upload.ts src/components/product/CustomizeCanvas.tsx src/components/admin/PrintTemplateEditor.tsx src/components/admin/ProductForm.tsx src/app/admin/\(dashboard\)/categories/page.tsx src/app/products/\[slug\]/customize/page.tsx src/components/cart/CartContext.tsx src/app/api/checkout/create-order/route.ts src/app/admin/\(dashboard\)/orders/\[id\]/page.tsx src/app/api/upload/route.ts src/app/api/upload-url/route.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Template assertions
        run: |
          npx tsx -e "import { normalizePrintTemplate, outputPixels, defaultViews } from './src/lib/print-template.ts'; const mug=normalizePrintTemplate({templateVersion:1,printType:'cylindrical',shape:'rectangle',physical:{width:7.5,height:3.5,unit:'in',dpi:300},safeArea:{topPct:3,rightPct:3,bottomPct:3,leftPct:3},views:defaultViews('cylindrical')}); const out=outputPixels(mug); if(out.widthPx!==2250||out.heightPx!==1050) throw new Error(JSON.stringify(out)); if(mug.views.length!==3) throw new Error('cylindrical views'); const a3=normalizePrintTemplate({templateVersion:1,printType:'flat',shape:'rectangle',physical:{width:11.7,height:16.5,unit:'in',dpi:300},safeArea:{topPct:3,rightPct:3,bottomPct:3,leftPct:3},views:defaultViews('flat')}); const a3out=outputPixels(a3); if(a3out.widthPx!==3510||a3out.heightPx!==4950) throw new Error(JSON.stringify(a3out));"
