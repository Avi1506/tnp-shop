name: Temporary cylindrical preview verification
on:
  push:
    branches:
      - feat/customization-engine-v2-20260928

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused ESLint
        run: npx eslint src/db/schema.ts src/lib/print-template.ts src/lib/cylindrical-preview.ts src/components/product/CylindricalSurfacePreview.tsx src/components/product/CustomizeCanvas.tsx src/components/admin/PrintTemplateEditor.tsx src/app/admin/\(dashboard\)/categories/page.tsx
      - name: TypeScript
        run: npx next typegen && npx tsc --noEmit
      - name: Cylindrical mapper assertions
        run: |
          npx tsx -e "import { buildCylindricalSlices } from './src/lib/cylindrical-preview.ts'; const s=buildCylindricalSlices({curvatureStrength:1,edgeFalloff:.35,sliceCount:96}); if(s.length!==96) throw new Error('slice count'); const mid=s[48].destEnd-s[48].destStart; const edge=s[0].destEnd-s[0].destStart; if(!(mid>edge*2)) throw new Error('center must remain wider than edge'); if(!(s[0].alpha<s[48].alpha)) throw new Error('edge falloff missing'); const flat=buildCylindricalSlices({curvatureStrength:0,sliceCount:48}); const a=flat[0].destEnd-flat[0].destStart; const b=flat[24].destEnd-flat[24].destStart; if(Math.abs(a-b)>.0001) throw new Error('flat projection must be linear');"
      - name: Build
        run: npm run build
